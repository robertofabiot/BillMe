spring.application.name=BillMe
# Configuración del Datasource (Shared Pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo lo valida.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Las respuestas se arman dentro de las transacciones de los servicios
spring.jpa.open-in-view=false
# Carga perezosa en lotes para evitar una consulta por cada factura/detalle
spring.jpa.properties.hibernate.default_batch_fetch_size=50
