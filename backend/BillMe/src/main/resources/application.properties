spring.application.name=BillMe
# Render define el puerto en la variable PORT
server.port=${PORT:8080}
# Configuración del Datasource (Shared Pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Seguridad: clave del JWT en base64 (mínimo 256 bits) y dominios del frontend separados por coma
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Configuración de JPA / Hibernate
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo lo valida.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Las respuestas se arman dentro de las transacciones de los servicios
spring.jpa.open-in-view=false
# Carga perezosa en lotes para evitar una consulta por cada factura/detalle
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Inserciones por lotes (importar miles de productos de la lista del proveedor)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Primer usuario: se crea solo cuando la base no tiene ninguno.
# Definir BILLME_USUARIO_INICIAL y BILLME_PASSWORD_INICIAL (mínimo 8 caracteres) en el entorno.
billme.usuario-inicial.username=${BILLME_USUARIO_INICIAL:}
billme.usuario-inicial.password=${BILLME_PASSWORD_INICIAL:}
billme.usuario-inicial.nombre=${BILLME_NOMBRE_INICIAL:Administrador}

# Salud del servicio: Render la usa para saber si la app está viva; el login la usa para "despertarla"
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Actuator no usa CorsConfig: el login consulta la salud desde el dominio del frontend
management.endpoints.web.cors.allowed-origins=${cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET

# Archivos de Excel de la lista de precios (la del proveedor pesa ~2 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
