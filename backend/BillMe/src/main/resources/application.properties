spring.application.name=BillMe
# Render define el puerto en la variable PORT
server.port=${PORT:8080}
# Configuración del Datasource (Shared Pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo lo valida.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Las respuestas se arman dentro de las transacciones de los servicios
spring.jpa.open-in-view=false
# Carga perezosa en lotes para evitar una consulta por cada factura/detalle
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Primer usuario: se crea solo cuando la base no tiene ninguno.
# Definir BILLME_USUARIO_INICIAL y BILLME_PASSWORD_INICIAL (mínimo 8 caracteres) en el entorno.
billme.usuario-inicial.username=${BILLME_USUARIO_INICIAL:}
billme.usuario-inicial.password=${BILLME_PASSWORD_INICIAL:}
billme.usuario-inicial.nombre=${BILLME_NOMBRE_INICIAL:Administrador}
