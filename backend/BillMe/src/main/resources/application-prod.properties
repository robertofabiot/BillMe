# Perfil de producción (Render + Supabase). Se activa con SPRING_PROFILES_ACTIVE=prod (ya viene en el Dockerfile).

# Supabase gratis admite pocas conexiones y el sistema lo usan 2 personas
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Pocos hilos bastan para 2 usuarios y ahorran memoria
server.tomcat.threads.max=20

# Render termina HTTPS en su proxy y reenvía las cabeceras X-Forwarded-*
server.forward-headers-strategy=framework
