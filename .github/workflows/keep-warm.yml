name: Mantener despierto el backend

# En el plan gratis, Render duerme el servicio tras 15 min sin uso. Un ping cada
# 10 min en horario laboral evita la espera al abrir la app (y de paso mantiene
# activa la base de Supabase, porque el health check la consulta).
on:
  schedule:
    - cron: '*/10 13-23 * * *' # 07:00–17:50 hora de Nicaragua (UTC-6)
    - cron: '*/10 0-3 * * *'   # 18:00–21:50 hora de Nicaragua
  workflow_dispatch:

jobs:
  ping:
    # Sin BACKEND_URL todavía no hay nada desplegado: no se corre (ni falla)
    if: ${{ vars.BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar /actuator/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "Falta la variable BACKEND_URL"; exit 1; }
          curl --fail --silent --show-error --max-time 120 --retry 2 "$BACKEND_URL/actuator/health"
